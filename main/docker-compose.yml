services:
  postgres:
    image: postgres:16-alpine
    container_name: assessor-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: db_AI
    ports:
      - "5432:5432"
    volumes:
      - assessor_ai_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./functions.sql:/docker-entrypoint-initdb.d/02-functions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_AI"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  assessor_ai_postgres_data:
